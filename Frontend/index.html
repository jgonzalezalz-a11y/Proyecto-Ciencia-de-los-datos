<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción de Empleabilidad | Modelo Completo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card card-custom p-4 p-md-5">
                <h2 class="text-center mb-2">Sistema Predictivo de Colocación</h2>
                <p class="text-muted text-center mb-5">Ingresa todas las métricas del estudiante según el dataset preprocesado.</p>
                
                <form id="predictionForm">
                    <!-- SECCIÓN 1: Perfil Personal y Académico -->
                    <h4 class="section-title">Perfil Personal y Académico</h4>
                    <div class="row mb-4">
                        <div class="col-md-3 mb-3">
                            <label for="age" class="form-label">Edad</label>
                            <input type="number" class="form-control" id="age" required value="21">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="gender" class="form-label">Género</label>
                            <select class="form-select" id="gender" required>
                                <option value="1">Masculino</option>
                                <option value="0">Femenino</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="collegeTier" class="form-label">Nivel de Universidad</label>
                            <select class="form-select" id="collegeTier" required>
                                <option value="Tier 1">Tier 1</option>
                                <option value="Tier 2">Tier 2</option>
                                <option value="Tier 3">Tier 3</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="branch" class="form-label">Rama / Carrera</label>
                            <select class="form-select" id="branch" required>
                                <option value="CSE">CSE</option>
                                <option value="IT">IT</option>
                                <option value="EEE">EEE</option>
                                <option value="ECE">ECE</option>
                                <option value="Civil">Civil</option>
                                <option value="Mechanical">Mechanical</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="cgpa" class="form-label">Promedio (CGPA)</label>
                            <input type="number" step="0.01" class="form-control" id="cgpa" required placeholder="0.0 - 10.0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="attendance" class="form-label">% Asistencia</label>
                            <input type="number" class="form-control" id="attendance" required placeholder="Ej. 85">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="backlogs" class="form-label">Materias Reprobadas</label>
                            <input type="number" class="form-control" id="backlogs" required value="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="studyHours" class="form-label">Horas Estudio/Día</label>
                            <input type="number" class="form-control" id="studyHours" required placeholder="Ej. 4">
                        </div>
                    </div>

                    <!-- SECCIÓN 2: Métricas de Habilidades (Scores) -->
                    <h4 class="section-title">Métricas de Habilidades (0 - 100)</h4>
                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <label for="codingScore" class="form-label">Puntaje Programación</label>
                            <input type="number" class="form-control" id="codingScore" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="aptitudeScore" class="form-label">Puntaje Aptitud</label>
                            <input type="number" class="form-control" id="aptitudeScore" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="communicationScore" class="form-label">Habilidades Comunicativas</label>
                            <input type="number" class="form-control" id="communicationScore" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="logicalScore" class="form-label">Razonamiento Lógico</label>
                            <input type="number" class="form-control" id="logicalScore" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="mockInterview" class="form-label">Simulacro Entrevista</label>
                            <input type="number" class="form-control" id="mockInterview" required>
                        </div>
                    </div>

                    <!-- SECCIÓN 3: Experiencia, Proyectos y Extracurriculares -->
                    <h4 class="section-title">Experiencia y Actividades Extra</h4>
                    <div class="row mb-4">
                        <div class="col-md-3 mb-3">
                            <label for="internships" class="form-label">Pasantías</label>
                            <input type="number" class="form-control" id="internships" required value="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="projects" class="form-label">Proyectos</label>
                            <input type="number" class="form-control" id="projects" required value="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="certifications" class="form-label">Certificaciones</label>
                            <input type="number" class="form-control" id="certifications" required value="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="hackathons" class="form-label">Hackathons</label>
                            <input type="number" class="form-control" id="hackathons" required value="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="githubRepos" class="form-label">Repositorios GitHub</label>
                            <input type="number" class="form-control" id="githubRepos" required value="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="linkedin" class="form-label">Contactos LinkedIn</label>
                            <input type="number" class="form-control" id="linkedin" required placeholder="Ej. 500">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="extracurricular" class="form-label">Puntaje Extracurricular</label>
                            <input type="number" class="form-control" id="extracurricular" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="leadership" class="form-label">Puntaje Liderazgo</label>
                            <input type="number" class="form-control" id="leadership" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="volunteer" class="form-label">Voluntariado</label>
                            <select class="form-select" id="volunteer" required>
                                <option value="1">Sí</option>
                                <option value="0">No</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Procesar Vector Completo y Predecir</button>
                    </div>
                </form>
                
                <div id="resultSection" class="result-section alert text-center shadow-sm">
                    <h4 id="predictionStatus" class="mb-2 fw-bold"></h4>
                    <p id="predictionSalary" class="mb-0 fs-5"></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>

                        </div>

                        </div>
                    </div>

                    <div class="row mb-3">

                        </div>

                                <option value="Tier 1">Tier 1</option>
                                <option value="Tier 2">Tier 2</option>
                                <option value="Tier 3">Tier 3</option>
                            </select>

                    </div>

                            <label for="branch" class="form-label">Rama / Carrera</label>

                                <option value="CSE">Ciencias de la Computación (CSE)</option>

                        <div class="col-md-6">
                            <label for="projects" class="form-label">Número de Proyectos</label>
                            <input type="number" class="form-control" id="projects" required placeholder="Ej. 4">
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Realizar Predicción</button>
                    </div>
                </form>

                <div id="resultSection" class="result-section alert text-center">
                    <h4 id="predictionStatus" class="mb-2"></h4>
                    <p id="predictionSalary" class="mb-0 fs-5"></p>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

</body>
</html>
